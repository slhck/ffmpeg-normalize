[build-system]
requires = ["uv_build>=0.8.14,<1.0.0"]
build-backend = "uv_build"

[project]
name = "ffmpeg-normalize"
version = "1.44.1"
description = "Normalize audio via ffmpeg"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "Werner Robitza", email = "werner.robitza@gmail.com"}
]
keywords = ["ffmpeg", "normalize", "audio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.10"
dependencies = [
    "ffmpeg-progress-yield>=1.0.1",
    "mutagen>=1.47.0",
    "rich>=13.7.0",
    "rich-argparse>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/slhck/ffmpeg-normalize"
Repository = "https://github.com/slhck/ffmpeg-normalize"

[project.scripts]
ffmpeg-normalize = "ffmpeg_normalize.__main__:main"

[tool.uv_build]
src-layout = true
package-data = {"ffmpeg_normalize" = ["data/**/*.json"]}

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.11",
    "shtab>=1.7.0",
    "ty>=0.0.24",
]

[tool.ty.rules]
invalid-argument-type = "warn"
too-many-positional-arguments = "warn"

